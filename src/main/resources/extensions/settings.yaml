apiVersion: v1alpha1
kind: Setting
metadata:
  name: ihalo-settings
spec:
  forms:
    - group: ai
      label: AI 设置
      formSchema:
        - $formkit: aiModelSelector
          name: modelName
          label: 语言模型
          modelType: language
          available: true
          validation: required
          placeholder: 请选择已配置的 AI 模型
          help: 由 AI Foundation 插件提供，选择后 ihALO 使用该模型生成内容。
        - $formkit: number
          name: temperature
          label: 随机性 temperature
          value: 0.7
          help: 取值越大输出越有创造性，范围 0-2。
        - $formkit: number
          name: maxTokens
          label: 最大输出 token
          value: 2048
          help: 单次生成的最大 token 数。
        - $formkit: textarea
          name: systemPrompt
          label: 自定义系统提示词（可选）
          placeholder: 额外的写作要求或风格约束
          help: 追加到内置提示词之后的补充要求。
